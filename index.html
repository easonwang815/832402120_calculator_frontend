<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leave the API address empty for the current same-server deployment. -->
    <meta name="api-base" content="">
    <title>Frontend-Backend Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

    <!-- Calculator panel. -->
    <div class="calculator">
        <h1>Calculator</h1>

        <!-- Expression, result and error message. -->
        <div class="display">
            <div class="expression" id="expression">&nbsp;</div>
            <div class="result" id="result" aria-live="polite">&nbsp;</div>
            <div class="error" id="error" role="alert" aria-live="assertive"></div>
        </div>

        <div class="scientific-buttons" aria-label="Scientific functions">
            <button class="btn sci" data-action="input" data-value="sin(">sin</button>
            <button class="btn sci" data-action="input" data-value="cos(">cos</button>
            <button class="btn sci" data-action="input" data-value="tan(">tan</button>
            <button class="btn sci" data-action="input" data-value="sqrt(">√</button>
            <button class="btn sci" data-action="input" data-value="^">xʸ</button>
        </div>

        <!-- Display multiplication and division symbols on the buttons. -->
        <div class="buttons">
            <button class="btn fn" data-action="clear">C</button>
            <button class="btn fn" data-action="backspace">⌫</button>
            <button class="btn fn" data-action="input" data-value="(">(</button>
            <button class="btn fn" data-action="input" data-value=")">)</button>

            <button class="btn op" data-action="input" data-value="÷">÷</button>
            <button class="btn num" data-value="7">7</button>
            <button class="btn num" data-value="8">8</button>
            <button class="btn num" data-value="9">9</button>

            <button class="btn op" data-action="input" data-value="×">×</button>
            <button class="btn num" data-value="4">4</button>
            <button class="btn num" data-value="5">5</button>
            <button class="btn num" data-value="6">6</button>

            <button class="btn op" data-action="input" data-value="-">-</button>
            <button class="btn num" data-value="1">1</button>
            <button class="btn num" data-value="2">2</button>
            <button class="btn num" data-value="3">3</button>

            <button class="btn op" data-action="input" data-value="+">+</button>
            <button class="btn num" data-value="0">0</button>
            <button class="btn num" data-value=".">.</button>
            <button class="btn eq" id="calculate-button" data-action="calculate">=</button>
        </div>
    </div>

    <!-- History panel. -->
    <div class="history">
        <div class="history-header">
            <h2>Calculation History</h2>
            <button id="clear-history" class="clear-btn">Clear All</button>
        </div>
        <div class="history-search">
            <input id="history-keyword" type="search" maxlength="100"
                   placeholder="Search expression or result" aria-label="Search history">
            <button id="search-history" type="button">Search</button>
        </div>
        <div id="history-status" class="history-status" role="status" aria-live="polite"></div>
        <ul id="history-list"></ul>
        <div id="history-empty" class="history-empty">No history yet</div>
        <div id="history-pagination" class="pagination">
            <button id="previous-page" type="button">Previous</button>
            <span id="page-info">Page 1 / 1</span>
            <button id="next-page" type="button">Next</button>
        </div>
    </div>

    <!-- Number-base conversion is done by the backend. -->
    <div class="converter">
        <h2>Base Conversion</h2>
        <label for="conversion-value">Integer to convert</label>
        <input id="conversion-value" type="text" maxlength="1024"
               placeholder="For example: 255 or FF">
        <div class="base-selectors">
            <label>
                From
                <select id="from-base">
                    <option value="2">Base 2</option>
                    <option value="8">Base 8</option>
                    <option value="10" selected>Base 10</option>
                    <option value="16">Base 16</option>
                </select>
            </label>
            <button id="swap-bases" class="swap-btn" type="button" aria-label="Swap bases">⇄</button>
            <label>
                To
                <select id="to-base">
                    <option value="2">Base 2</option>
                    <option value="8">Base 8</option>
                    <option value="10">Base 10</option>
                    <option value="16" selected>Base 16</option>
                </select>
            </label>
        </div>
        <button id="convert-button" class="convert-btn" type="button">Convert</button>
        <div id="conversion-result" class="conversion-result" aria-live="polite"></div>
        <div id="conversion-error" class="error" role="alert" aria-live="assertive"></div>
    </div>

</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
